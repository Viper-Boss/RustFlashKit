name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --clean rustflashkit.spec
      - name: Bundle profiles and tools docs
        run: |
          New-Item -ItemType Directory -Force dist/RustFlashKit/profiles | Out-Null
          New-Item -ItemType Directory -Force dist/RustFlashKit/tools | Out-Null
          Copy-Item profiles/*.json dist/RustFlashKit/profiles/
          Copy-Item tools/README.md dist/RustFlashKit/tools/
      - name: Upload artifact (every main push)
        uses: actions/upload-artifact@v4
        with:
          name: RustFlashKit-win64
          path: dist/RustFlashKit/
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/RustFlashKit -DestinationPath RustFlashKit-${{ github.ref_name }}-win64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RustFlashKit-*-win64.zip
          generate_release_notes: true
